<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карта с приветствием</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            padding: 15px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        #header {
            padding: 10px 0;
            text-align: center;
            font-size: 18px;
            margin-bottom: 10px;
        }
        #map-container {
            flex: 1;
            margin-bottom: 15px;
            border-radius: 12px;
            overflow: hidden;
        }
        #map {
            width: 100%;
            height: 100%;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #2481cc;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        button:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div id="header">Привет, <span id="username">Гость</span>!</div>
    <div id="map-container">
        <div id="map"></div>
    </div>
    <button id="sendButton" disabled>Отправить координаты</button>

    <script>
        // Получаем имя пользователя из URL
        const urlParams = new URLSearchParams(window.location.search);
        const username = urlParams.get('username') || 'Гость';
        
        // Отображаем имя пользователя
        document.getElementById('username').textContent = username;
        
        // Инициализация карты
        const map = L.map('map').setView([55.751574, 37.573856], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);
        
        let marker;
        map.on('click', (e) => {
            if (marker) map.removeLayer(marker);
            marker = L.marker(e.latlng).addTo(map);
            document.getElementById('sendButton').disabled = false;
        });
        
        // Обработчик кнопки отправки
        document.getElementById('sendButton').addEventListener('click', () => {
            if (!marker) return;
            
            const coords = marker.getLatLng();
            const data = {
                username: username,
                latitude: coords.lat,
                longitude: coords.lng
            };
            
            Telegram.WebApp.sendData(JSON.stringify(data));
            Telegram.WebApp.close();
        });
        
        // Инициализация Telegram WebApp
        Telegram.WebApp.ready();
    </script>
</body>
</html>
