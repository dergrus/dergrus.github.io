<!DOCTYPE html>
<html>
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://api-maps.yandex.ru/2.1/?apikey=675b45d6-a47a-413b-9af6-dccf2d9e1d65&lang=ru_RU"></script>
    <style>/* ... стили ... */</style>
</head>
<body>
    <div id="map"></div>
    <button id="sendBtn">Отправить</button>

    <script>
        // Инициализация WebApp
        function initTelegram() {
            if (typeof Telegram === 'undefined') {
                console.error("Telegram object not found!");
                return false;
            }
            
            if (!Telegram.WebApp) {
                console.error("Telegram.WebApp not available");
                return false;
            }
            
            Telegram.WebApp.ready();
            console.log("Telegram WebApp initialized. Version:", Telegram.WebApp.version);
            return true;
        }

        // Проверяем инициализацию
        if (!initTelegram()) {
            alert("Ошибка инициализации Telegram API. Приложение работает в ограниченном режиме.");
        }

        // Инициализация карты
        ymaps.ready(() => {
            const map = new ymaps.Map("map", {...});
            
            document.getElementById('sendBtn').addEventListener('click', () => {
                const coords = map.getCenter();
                
                // Пытаемся отправить через Telegram API
                try {
                    if (typeof Telegram !== 'undefined' && Telegram.WebApp) {
                        Telegram.WebApp.sendData(JSON.stringify({
                            lat: coords[0],
                            lon: coords[1]
                        }));
                    } else {
                        throw new Error("Telegram API unavailable");
                    }
                } catch (error) {
                    console.error("Send error:", error);
                    alert("Ошибка отправки: " + error.message);
                }
            });
        });
    </script>
</body>
</html>
