<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Форма обратной связи</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { padding: 20px; font-family: sans-serif; }
        input, textarea { width: 100%; padding: 10px; margin-bottom: 15px; }
        button { padding: 12px 24px; background: #2481cc; color: white; border: none; }
    </style>
</head>
<body>
    <h2>Форма обратной связи</h2>
    
    <input type="text" id="name" placeholder="Ваше имя">
    <textarea id="message" placeholder="Ваше сообщение" rows="4"></textarea>
    
    <button onclick="submitForm()">Отправить</button>

    <script>
        function submitForm() {
            const formData = {
                name: document.getElementById('name').value,
                message: document.getElementById('message').value
            };
            
            Telegram.WebApp.sendData(JSON.stringify(formData));
            Telegram.WebApp.close();
        }
        
        Telegram.WebApp.ready();
    </script>
</body>
</html>
