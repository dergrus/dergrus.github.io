<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выбор координат</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://api-maps.yandex.ru/2.1/?apikey=675b45d6-a47a-413b-9af6-dccf2d9e1d65&lang=ru_RU"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            background: #0088cc;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 18px;
        }
        
        #map {
            flex-grow: 1;
            width: 100%;
        }
        
        .footer {
            padding: 10px;
            background: #f5f5f5;
            text-align: center;
            border-top: 1px solid #ddd;
        }
        
        .coordinates {
            margin: 10px 0;
            font-size: 14px;
            color: #555;
        }
        
        button {
            background: #0088cc;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }
        
        button:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }
        
        button:hover:not(:disabled) {
            background: #006699;
        }
    </style>
</head>
<body>
    <div class="header">Выберите точку на карте</div>
    <div id="map"></div>
    <div class="footer">
        <div class="coordinates">Координаты: <span id="coords-display">не выбраны</span></div>
        <button id="send-btn" disabled>Отправить координаты</button>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand(); // Развернуть приложение на весь экран
        tg.MainButton.hide(); // Скрыть основную кнопку
        
        // Переменные для хранения координат
        let selectedCoords = null;
        let map, placemark;
        
        // Инициализация карты
        ymaps.ready(initMap);
        
        function initMap() {
            // Создание карты
            map = new ymaps.Map("map", {
                center: [55.751244, 37.618423], // Москва
                zoom: 10,
                controls: ['zoomControl']
            });
            
            // Обработчик клика по карте
            map.events.add('click', (e) => {
                const coords = e.get('coords');
                selectedCoords = coords;
                
                // Удаляем предыдущую метку, если есть
                if (placemark) {
                    map.geoObjects.remove(placemark);
                }
                
                // Создаем новую метку
                placemark = new ymaps.Placemark(coords, {}, {
                    preset: 'islands#redDotIcon',
                    draggable: false
                });
                
                map.geoObjects.add(placemark);
                
                // Обновление отображения координат
                document.getElementById('coords-display').textContent = 
                    `${coords[0].toFixed(6)}, ${coords[1].toFixed(6)}`;
                
                // Активируем кнопку отправки
                document.getElementById('send-btn').disabled = false;
            });
        }
        
        // Обработчик кнопки отправки
        document.getElementById('send-btn').addEventListener('click', () => {
            if (selectedCoords) {
                // Формируем данные в формате JSON
                const data = JSON.stringify({
                    lat: selectedCoords[0],
                    lon: selectedCoords[1]
                });
                
                // Отправляем данные в Telegram
                tg.sendData(data);
                tg.close(); // Закрыть веб-приложение
            }
        });
    </script>
</body>
</html>
