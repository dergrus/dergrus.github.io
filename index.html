<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Карта</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, #map { margin: 0; padding: 0; height: 100vh; }
        button { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); padding: 12px 24px; z-index: 1000; }
    </style>
</head>
<body>
    <div id="map"></div>
    <button id="sendButton" disabled>Отправить координаты</button>

    <script>
        const map = L.map('map').setView([55.751574, 37.573856], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        
        let marker;
        map.on('click', (e) => {
            if (marker) map.removeLayer(marker);
            marker = L.marker(e.latlng).addTo(map);
            document.getElementById('sendButton').disabled = false;
        });
        
        document.getElementById('sendButton').addEventListener('click', () => {
            if (!marker) return;
            const coords = marker.getLatLng();
            Telegram.WebApp.sendData(`Широта: ${coords.lat}, Долгота: ${coords.lng}`);
            Telegram.WebApp.close();
        });
        
        Telegram.WebApp.ready();
    </script>
</body>
</html>
