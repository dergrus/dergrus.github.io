<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выбор координат</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://api-maps.yandex.ru/2.1/?apikey=675b45d6-a47a-413b-9af6-dccf2d9e1d65&lang=ru_RU"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh; 
            display: flex; 
            flex-direction: column;
            background: #f0f2f5;
        }
        .header {
            background: #0088cc;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 18px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        #map {
            flex-grow: 1;
            width: 100%;
        }
        .footer {
            padding: 15px;
            background: white;
            text-align: center;
            border-top: 1px solid #ddd;
            box-shadow: 0 -2px 5px rgba(0,0,0,0.05);
        }
        .coordinates {
            margin: 10px 0;
            font-size: 14px;
            color: #555;
            background: #f9f9f9;
            padding: 8px;
            border-radius: 8px;
            font-family: monospace;
        }
        button {
            background: #0088cc;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s;
            width: 100%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        button:disabled {
            background: #cccccc;
            cursor: not-allowed;
            opacity: 0.7;
        }
        button:not(:disabled):hover {
            background: #0077b3;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }
        .status {
            margin-top: 10px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="header">Выберите точку на карте</div>
    <div id="map"></div>
    <div class="footer">
        <div class="coordinates">Координаты: <span id="coords-display">не выбраны</span></div>
        <button id="send-btn" disabled>Отправить координаты</button>
        <div class="status" id="status">Готово к работе</div>
    </div>

    <script>
        // ================== Инициализация ==================
        const tg = window.Telegram.WebApp;
        const statusEl = document.getElementById('status');
        let selectedCoords = null;
        let map, placemark;
        
        // Инициализация Telegram WebApp
        tg.expand();
        tg.MainButton.hide();
        statusEl.textContent = "Инициализация карты...";
        
        // ================== Функции карты ==================
        function initMap() {
            try {
                statusEl.textContent = "Загрузка карты...";
                
                map = new ymaps.Map("map", {
                    center: [55.751244, 37.618423],
                    zoom: 10,
                    controls: ['zoomControl', 'fullscreenControl']
                });
                
                statusEl.textContent = "Карта загружена. Выберите точку";
                
                // Обработчик клика по карте
                map.events.add('click', (e) => {
                    const coords = e.get('coords');
                    selectedCoords = coords;
                    
                    // Удаляем предыдущую метку
                    if (placemark) {
                        map.geoObjects.remove(placemark);
                    }
                    
                    // Создаем новую метку
                    placemark = new ymaps.Placemark(coords, {}, {
                        preset: 'islands#redDotIcon',
                        draggable: false
                    });
                    
                    map.geoObjects.add(placemark);
                    
                    // Обновляем отображение координат
                    document.getElementById('coords-display').textContent = 
                        `${coords[0].toFixed(6)}, ${coords[1].toFixed(6)}`;
                    
                    // Активируем кнопку
                    document.getElementById('send-btn').disabled = false;
                    statusEl.textContent = "Точка выбрана. Нажмите 'Отправить координаты'";
                });
                
            } catch (error) {
                console.error("Ошибка инициализации карты:", error);
                statusEl.textContent = "Ошибка загрузки карты";
                alert("Произошла ошибка при загрузке карты. Пожалуйста, попробуйте позже.");
            }
        }
        
        // ================== Обработчики событий ==================
        document.getElementById('send-btn').addEventListener('click', () => {
            if (selectedCoords) {
                try {
                    statusEl.textContent = "Отправка данных...";
                    
                    const data = JSON.stringify({
                        lat: selectedCoords[0],
                        lon: selectedCoords[1],
                        timestamp: new Date().toISOString()
                    });
                    
                    console.log("Отправляемые данные:", data);
                    
                    // Отправляем данные
                    tg.sendData(data);
                    
                    // Закрываем веб-приложение
                    setTimeout(() => {
                        tg.close();
                    }, 300);
                    
                } catch (error) {
                    console.error("Ошибка отправки данных:", error);
                    statusEl.textContent = "Ошибка отправки данных";
                    alert("Произошла ошибка при отправке данных. Пожалуйста, попробуйте снова.");
                }
            }
        });
        
        // ================== Запуск карты ==================
        ymaps.ready(initMap);
        
        // Обработчик ошибок карты
        ymaps.ready().then(
            () => console.log("YMaps успешно загружен"),
            (err) => {
                console.error("Ошибка загрузки Yandex Maps:", err);
                statusEl.textContent = "Ошибка загрузки карты";
                alert("Не удалось загрузить карты. Пожалуйста, проверьте интернет-соединение.");
            }
        );
    </script>
</body>
</html>
