<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram WebApp</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { background: rgba(255, 255, 255, 0.95); border-radius: 20px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2); width: 100%; max-width: 500px; padding: 40px; text-align: center; }
        h1 { color: #333; margin-bottom: 20px; font-size: 32px; }
        textarea { width: 100%; height: 100px; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 10px; resize: vertical; }
        .btn { background: #4CAF50; color: white; border: none; padding: 12px 30px; font-size: 18px; border-radius: 50px; cursor: pointer; margin: 20px 0; transition: all 0.3s ease; }
        .btn:hover { background: #45a049; transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2); }
        .status { margin-top: 20px; padding: 15px; border-radius: 10px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Отправить сообщение в Telegram</h1>
        
        <textarea id="messageText" placeholder="Введите ваше сообщение..."></textarea>
        
        <button class="btn" id="sendBtn">Отправить сообщение</button>
        
        <div class="status" id="status">
            Статус: Ожидание действий...
        </div>
    </div>

    <script>
        const webApp = Telegram.WebApp;
        const statusEl = document.getElementById('status');
        const messageInput = document.getElementById('messageText');
        const sendBtn = document.getElementById('sendBtn');
        
        // Конфигурация (ЗАМЕНИТЕ НА ВАШИ ДАННЫЕ)
        const API_SERVER = "https://your-fastapi-server.com"; // Адрес вашего FastAPI сервера
        const SECRET_KEY = "your-secret-key"; // Должен совпадать с SECRET_KEY на сервере
        
        // Инициализация
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof webApp !== 'undefined') {
                webApp.ready();
                webApp.expand();
                statusEl.innerHTML = "✅ Приложение готово к работе";
            }
            
            sendBtn.addEventListener('click', sendMessageToTelegram);
        });

        // Отправка сообщения через FastAPI сервер
        async function sendMessageToTelegram() {
            const message = messageInput.value.trim();
            
            if (!message) {
                statusEl.innerHTML = "❌ Введите текст сообщения";
                statusEl.className = "status error";
                return;
            }
            
            try {
                statusEl.innerHTML = "🔄 Отправка сообщения...";
                statusEl.className = "status";
                
                // Получаем ID пользователя из Telegram WebApp
                const userId = webApp.initDataUnsafe.user?.id;
                
                if (!userId) {
                    throw new Error("Не удалось получить ID пользователя");
                }
                
                // Отправляем на FastAPI сервер
                const response = await fetch(`${API_SERVER}/send-to-telegram`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        user_id: userId,
                        text: message,
                        secret: SECRET_KEY
                    })
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || "Ошибка сервера");
                }
                
                statusEl.innerHTML = "✅ Сообщение успешно отправлено!";
                statusEl.className = "status success";
                
                // Очищаем поле ввода
                messageInput.value = '';
                
            } catch (error) {
                console.error("Ошибка:", error);
                statusEl.innerHTML = `❌ Ошибка: ${error.message}`;
                statusEl.className = "status error";
            }
        }
    </script>
</body>
</html>
