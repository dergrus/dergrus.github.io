<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Web App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            background-color: #f0f2f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            text-align: center;
            max-width: 90%;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            background-color: #0088cc;
            color: white;
            border: none;
            border-radius: 10px;
            transition: all 0.3s ease;
        }
        button:hover {
            background-color: #006699;
            transform: scale(1.05);
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Приветственное приложение</h1>
        <button onclick="sendHello()">Отправить "Привет!"</button>
    </div>

    <script>
        // Инициализация Web App (ОБЯЗАТЕЛЬНО!)
        Telegram.WebApp.ready();
        
        function sendHello() {
            // Отправляем строку с приветствием
            Telegram.WebApp.sendData("Привет!");
            
            // Закрываем веб-приложение
            Telegram.WebApp.close();
        }
    </script>
</body>
</html>
