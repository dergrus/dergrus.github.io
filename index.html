<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карта с приветствием</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { padding: 15px; height: 100vh; display: flex; flex-direction: column; }
        #header { padding: 10px 0; text-align: center; font-size: 18px; }
        #map-container { flex: 1; margin: 10px 0; border-radius: 12px; overflow: hidden; }
        #map { width: 100%; height: 100%; }
        #data-display { padding: 10px; background: #f0f0f0; border-radius: 8px; margin-bottom: 10px; }
        button { padding: 14px; background: #2481cc; color: white; border: none; border-radius: 8px; font-size: 16px; width: 100%; }
        button:disabled { background: #cccccc; }
    </style>
</head>
<body>
    <div id="header">Привет, <span id="username">Гость</span>!</div>
    <div id="map-container"><div id="map"></div></div>
    <div id="data-display">Выберите точку на карте</div>
    <button id="confirmButton" disabled>Подтвердить координаты</button>

    <script>
        // Получаем параметры из URL
        const params = new URLSearchParams(window.location.search);
        const username = params.get('username') ? decodeURIComponent(params.get('username')) : 'Гость';
        const user_id = params.get('user_id') || '0';
        
        // Отображаем имя пользователя
        document.getElementById('username').textContent = username;
        
        // Инициализация карты
        const map = L.map('map').setView([55.751574, 37.573856], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        
        let marker, selectedCoords = null;
        
        // Обработчик клика по карте
        map.on('click', (e) => {
            if (marker) map.removeLayer(marker);
            
            marker = L.marker(e.latlng).addTo(map);
            selectedCoords = e.latlng;
            
            document.getElementById('confirmButton').disabled = false;
            document.getElementById('data-display').innerHTML = 
                `Выбрано: Широта ${selectedCoords.lat.toFixed(6)}, Долгота ${selectedCoords.lng.toFixed(6)}`;
        });
        
        // Обработчик кнопки подтверждения
        document.getElementById('confirmButton').addEventListener('click', () => {
            if (!selectedCoords) return;
            
            // Сохраняем данные в localStorage
            localStorage.setItem('user_coords', JSON.stringify({
                user_id: user_id,
                username: username,
                latitude: selectedCoords.lat,
                longitude: selectedCoords.lng,
                timestamp: Date.now()
            }));
            
            // Закрываем веб-приложение
            Telegram.WebApp.close();
        });
        
        // Инициализация Telegram WebApp
        Telegram.WebApp.ready();
    </script>
</body>
</html>
