<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выбор координат</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://api-maps.yandex.ru/2.1/?apikey=ВАШ_API_КЛЮЧ&lang=ru_RU"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh; 
            display: flex; 
            flex-direction: column;
            background: #f0f2f5;
        }
        .header {
            background: #0088cc;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 18px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        #map {
            flex-grow: 1;
            width: 100%;
        }
        .footer {
            padding: 15px;
            background: white;
            text-align: center;
            border-top: 1px solid #ddd;
            box-shadow: 0 -2px 5px rgba(0,0,0,0.05);
        }
        .coordinates {
            margin: 10px 0;
            font-size: 14px;
            color: #555;
            background: #f9f9f9;
            padding: 8px;
            border-radius: 8px;
            font-family: monospace;
        }
        button {
            background: #0088cc;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s;
            width: 100%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        button:disabled {
            background: #cccccc;
            cursor: not-allowed;
            opacity: 0.7;
        }
        button:not(:disabled):hover {
            background: #0077b3;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }
        .status {
            margin-top: 10px;
            font-size: 12px;
            color: #888;
        }
        .debug {
            margin-top: 10px;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 5px;
            font-size: 11px;
            max-height: 100px;
            overflow-y: auto;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="header">Выберите точку на карте</div>
    <div id="map"></div>
    <div class="footer">
        <div class="coordinates">Координаты: <span id="coords-display">не выбраны</span></div>
        <button id="send-btn" disabled>Отправить координаты</button>
        <div class="status" id="status">Инициализация...</div>
        <div class="debug" id="debug"></div>
    </div>

    <script>
        // ================== Инициализация ==================
        const tg = window.Telegram.WebApp;
        const statusEl = document.getElementById('status');
        const debugEl = document.getElementById('debug');
        let selectedCoords = null;
        let map, placemark;
        
        // Функция логирования
        function log(message) {
            const now = new Date().toLocaleTimeString();
            debugEl.innerHTML += `[${now}] ${message}\n`;
            debugEl.scrollTop = debugEl.scrollHeight;
            console.log(message);
        }
        
        // Инициализация Telegram WebApp
        log("Инициализация Telegram WebApp");
        tg.expand();
        tg.MainButton.hide();
        log("WebApp инициализирован");
        statusEl.textContent = "Инициализация карты...";
        
        // ================== Функции карты ==================
        function initMap() {
            try {
                log("Инициализация карты");
                statusEl.textContent = "Загрузка карты...";
                
                map = new ymaps.Map("map", {
                    center: [55.751244, 37.618423],
                    zoom: 10,
                    controls: ['zoomControl', 'fullscreenControl']
                });
                
                log("Карта успешно загружена");
                statusEl.textContent = "Карта загружена. Выберите точку";
                
                // Обработчик клика по карте
                map.events.add('click', (e) => {
                    const coords = e.get('coords');
                    log(`Клик по карте: ${coords[0].toFixed(6)}, ${coords[1].toFixed(6)}`);
                    selectedCoords = coords;
                    
                    // Удаляем предыдущую метку
                    if (placemark) {
                        map.geoObjects.remove(placemark);
                    }
                    
                    // Создаем новую метку
                    placemark = new ymaps.Placemark(coords, {}, {
                        preset: 'islands#redDotIcon',
                        draggable: false
                    });
                    
                    map.geoObjects.add(placemark);
                    
                    // Обновляем отображение координат
                    document.getElementById('coords-display').textContent = 
                        `${coords[0].toFixed(6)}, ${coords[1].toFixed(6)}`;
                    
                    // Активируем кнопку
                    document.getElementById('send-btn').disabled = false;
                    statusEl.textContent = "Точка выбрана. Нажмите 'Отправить координаты'";
                });
                
            } catch (error) {
                const msg = `Ошибка инициализации карты: ${error}`;
                log(msg);
                statusEl.textContent = "Ошибка загрузки карты";
                alert(msg);
            }
        }
        
        // ================== Обработчики событий ==================
        document.getElementById('send-btn').addEventListener('click', () => {
            if (selectedCoords) {
                try {
                    statusEl.textContent = "Отправка данных...";
                    log("Подготовка данных к отправке");
                    
                    const data = JSON.stringify({
                        lat: selectedCoords[0],
                        lon: selectedCoords[1],
                        timestamp: new Date().toISOString()
                    });
                    
                    log(`Отправляемые данные: ${data}`);
                    
                    // Отправляем данные
                    tg.sendData(data);
                    log("Данные отправлены через tg.sendData()");
                    
                    // Закрываем веб-приложение
                    setTimeout(() => {
                        tg.close();
                        log("Веб-приложение закрыто");
                    }, 500);
                    
                } catch (error) {
                    const msg = `Ошибка отправки данных: ${error}`;
                    log(msg);
                    statusEl.textContent = "Ошибка отправки данных";
                    alert(msg);
                }
            } else {
                log("Попытка отправки без выбранных координат");
                alert("Пожалуйста, выберите точку на карте!");
            }
        });
        
        // ================== Запуск карты ==================
        log("Загрузка Яндекс.Карт...");
        ymaps.ready(initMap);
        
        // Обработчик ошибок карты
        ymaps.ready().then(
            () => log("YMaps успешно загружен"),
            (err) => {
                const msg = `Ошибка загрузки Yandex Maps: ${err}`;
                log(msg);
                statusEl.textContent = "Ошибка загрузки карты";
                alert(msg);
            }
        );
        
        // Дополнительная диагностика
        log(`Версия WebApp: ${tg.version}`);
        log(`Платформа: ${tg.platform}`);
        log(`Инициатор: ${tg.initData}`);
    </script>
</body>
</html>
