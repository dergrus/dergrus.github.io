<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тестовое веб-приложение</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 500px;
            padding: 40px;
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 32px;
        }
        p {
            color: #666;
            margin-bottom: 30px;
            font-size: 18px;
            line-height: 1.6;
        }
        .btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 20px;
            border-radius: 50px;
            cursor: pointer;
            margin: 20px 0;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        .btn:hover {
            background: #45a049;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
        }
        .status {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-top: 30px;
            font-size: 18px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        .success {
            background: #d4edda;
            color: #155724;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
        }
        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: #2575fc;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 40px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">T</div>
        <h1>Тест Telegram WebApp</h1>
        <p>Нажмите кнопку ниже, чтобы отправить тестовые данные в Telegram бота</p>
        
        <button class="btn" id="sendBtn">Отправить данные</button>
        
        <div class="status" id="status">
            Статус: Ожидание действий...
        </div>
    </div>

    <script>
        // Основной объект WebApp
        const webApp = Telegram.WebApp;
        
        // Инициализация при загрузке
        document.addEventListener('DOMContentLoaded', function() {
            console.log("DOM content loaded");
            
            // Инициализируем WebApp
            if (typeof webApp !== 'undefined') {
                console.log("Telegram WebApp detected");
                webApp.ready();
                webApp.expand();
                
                document.getElementById('status').innerHTML = 
                    "✅ Telegram WebApp инициализирован";
            } else {
                console.error("Telegram WebApp not found");
                document.getElementById('status').innerHTML = 
                    "❌ Telegram WebApp API не доступен";
                document.getElementById('status').className = "status error";
            }
            
            // Назначаем обработчик кнопки
            document.getElementById('sendBtn').addEventListener('click', sendData);
        });

        // Функция отправки данных
        function sendData() {
            const statusEl = document.getElementById('status');
            
            try {
                statusEl.innerHTML = "🔄 Отправка данных...";
                statusEl.className = "status";
                
                // Создаем тестовые данные
                const testData = {
                    action: "button_click",
                    message: "Привет, бот! Это данные из веб-приложения.",
                    timestamp: new Date().toISOString(),
                    user: "user_" + Math.floor(Math.random() * 1000)
                };
                
                console.log("Sending data:", testData);
                
                // Проверяем доступность WebApp
                if (typeof webApp === 'undefined' || !webApp.sendData) {
                    throw new Error("WebApp API недоступен");
                }
                
                // Отправляем данные
                webApp.sendData(JSON.stringify(testData));
                
                statusEl.innerHTML = "✅ Данные отправлены! Закройте окно.";
                statusEl.className = "status success";
                
            } catch (error) {
                console.error("Error in sendData:", error);
                statusEl.innerHTML = "❌ Ошибка: " + error.message;
                statusEl.className = "status error";
            }
        }
    </script>
</body>
</html>
