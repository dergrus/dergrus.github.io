<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тестовое веб-приложение</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: #f0f2f5;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 90%;
        }
        button {
            background: #2481cc;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.3s;
        }
        button:hover {
            background: #1c68a5;
        }
        .status {
            margin-top: 20px;
            padding: 10px;
            border-radius: 6px;
            background: #f8f9fa;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Тестовое веб-приложение</h2>
        <p>Нажмите кнопку, чтобы отправить сообщение боту:</p>
        
        <button onclick="sendData()">Отправить "Привет!"</button>
        
        <div class="status" id="status">
            Статус: Ожидание действий...
        </div>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const webApp = Telegram.WebApp;
        webApp.ready();
        webApp.expand();

        function sendData() {
            const statusElement = document.getElementById('status');
            statusElement.textContent = "Статус: Отправка данных...";
            
            try {
                // Отправляем структурированные данные
                const data = {
                    action: "send_message",
                    text: "Привет!",
                    timestamp: new Date().toISOString()
                };
                
                webApp.sendData(JSON.stringify(data));
                statusElement.textContent = "Статус: Данные успешно отправлены!";
                statusElement.style.color = "green";
                
            } catch (e) {
                statusElement.textContent = "Ошибка: " + e.message;
                statusElement.style.color = "red";
            }
        }
    </script>
</body>
</html>
