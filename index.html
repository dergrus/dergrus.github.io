<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Web App Debug</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            text-align: center;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            background: #0088cc;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 20px;
        }
        #status {
            margin-top: 30px;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 5px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <h1>Тестовое веб-приложение</h1>
    <button onclick="sendHello()">Отправить "Привет!"</button>
    
    <div id="status">Статус: готов к работе</div>

    <script>
        // Элемент для вывода статуса
        const statusEl = document.getElementById('status');
        
        try {
            // Инициализация Web App
            Telegram.WebApp.ready();
            statusEl.textContent = 'Статус: WebApp инициализирован';
            console.log("WebApp initialized");
        } catch (e) {
            statusEl.textContent = 'Ошибка инициализации: ' + e.message;
            console.error("Initialization error:", e);
        }
        
        function sendHello() {
            statusEl.textContent = 'Отправка данных...';
            console.log("Sending data...");
            
            try {
                // Отправляем данные
                Telegram.WebApp.sendData("Привет!");
                statusEl.textContent = 'Данные отправлены успешно!';
                console.log("Data sent successfully");
                
                // Закрываем веб-приложение через 1 секунду
                setTimeout(() => {
                    Telegram.WebApp.close();
                }, 1000);
            } catch (e) {
                statusEl.textContent = 'Ошибка отправки: ' + e.message;
                console.error("Send error:", e);
            }
        }
    </script>
</body>
</html>
