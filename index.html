<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выбор координат</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            padding: 15px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        #map-container {
            flex: 1;
            margin-bottom: 15px;
        }
        #map {
            width: 100%;
            height: 100%;
            border-radius: 12px;
        }
        #info {
            padding: 15px;
            font-size: 15px;
            text-align: center;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #2481cc;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        button:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div id="info">Нажмите на карту, чтобы выбрать координаты</div>
    
    <div id="map-container">
        <div id="map"></div>
    </div>
    
    <button id="sendButton" disabled>Отправить координаты</button>

    <script>
        let map, marker, selectedCoords = null;
        
        // Инициализация карты
        function initMap() {
            // Центр Москвы
            const defaultCoords = [55.751574, 37.573856];
            
            // Создаем карту
            map = L.map('map').setView(defaultCoords, 13);
            
            // Добавляем слой карты
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap'
            }).addTo(map);
            
            // Обработчик клика по карте
            map.on('click', (e) => {
                selectedCoords = [e.latlng.lat, e.latlng.lng];
                
                // Удаляем предыдущий маркер
                if (marker) map.removeLayer(marker);
                
                // Добавляем новый маркер
                marker = L.marker(selectedCoords).addTo(map);
                
                // Обновляем информацию
                document.getElementById('info').textContent = 
                    `Выбрано: Широта ${selectedCoords[0].toFixed(6)}, Долгота ${selectedCoords[1].toFixed(6)}`;
                
                // Активируем кнопку
                document.getElementById('sendButton').disabled = false;
            });
        }
        
        // Отправка данных
        function sendCoordinates() {
            if (!selectedCoords) return;
            
            // Формируем строку с координатами
            const coordsString = `Широта: ${selectedCoords[0]}, Долгота: ${selectedCoords[1]}`;
            
            // Отправляем данные
            Telegram.WebApp.sendData(coordsString);
            
            // Закрываем приложение
            Telegram.WebApp.close();
        }
        
        // Инициализация при загрузке
        document.addEventListener('DOMContentLoaded', () => {
            // Инициализируем Telegram WebApp
            Telegram.WebApp.ready();
            
            // Инициализируем карту
            initMap();
            
            // Назначаем обработчик кнопки
            document.getElementById('sendButton').addEventListener('click', sendCoordinates);
        });
    </script>
</body>
</html>
