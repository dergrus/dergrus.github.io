<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выбор координат</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://api-maps.yandex.ru/2.1/?apikey=ВАШ_API_КЛЮЧ_ЯНДЕКСА&lang=ru_RU"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            background: #0088cc;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 18px;
        }
        
        #map {
            flex-grow: 1;
            width: 100%;
        }
        
        .footer {
            padding: 10px;
            background: #f5f5f5;
            text-align: center;
            border-top: 1px solid #ddd;
        }
        
        .coordinates {
            margin: 10px 0;
            font-size: 14px;
            color: #555;
        }
        
        button {
            background: #0088cc;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="header">Выберите точку на карте</div>
    <div id="map"></div>
    <div class="footer">
        <div class="coordinates">Координаты: <span id="coords-display">не выбраны</span></div>
        <button id="send-btn">Отправить координаты</button>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand(); // Развернуть приложение на весь экран
        tg.MainButton.hide(); // Скрыть основную кнопку
        
        // Переменные для хранения координат
        let selectedCoords = null;
        
        // Инициализация карты
        ymaps.ready(initMap);
        
        function initMap() {
            // Создание карты
            const map = new ymaps.Map("map", {
                center: [55.751244, 37.618423], // Москва
                zoom: 10,
                controls: ['zoomControl']
            });
            
            // Создание метки
            const placemark = new ymaps.Placemark([0, 0], {}, {
                preset: 'islands#redDotIcon',
                draggable: false
            });
            
            // Обработчик клика по карте
            map.events.add('click', (e) => {
                const coords = e.get('coords');
                selectedCoords = coords;
                
                // Обновление метки
                placemark.geometry.setCoordinates(coords);
                map.geoObjects.removeAll();
                map.geoObjects.add(placemark);
                
                // Обновление отображения координат
                document.getElementById('coords-display').textContent = 
                    `${coords[0].toFixed(6)}, ${coords[1].toFixed(6)}`;
            });
        }
        
        // Обработчик кнопки отправки
        document.getElementById('send-btn').addEventListener('click', () => {
            if (selectedCoords) {
                // Отправка данных в Telegram
                tg.sendData(selectedCoords.join(';'));
                tg.close(); // Закрыть веб-приложение
            } else {
                alert('Пожалуйста, выберите точку на карте!');
            }
        });
    </script>
</body>
</html>
