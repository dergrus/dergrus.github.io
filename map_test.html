<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест отправки координат</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            margin-top: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Тест отправки данных в бота</h1>
    <p>Нажмите кнопку, чтобы отправить тестовые координаты</p>
    
    <button id="sendBtn">Отправить данные</button>
    
    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        
        // Отладочный вывод
        console.log("WebApp инициализирован");
        console.log("Версия WebApp:", tg.version);
        console.log("Платформа:", tg.platform);
        
        // Развернуть приложение на весь экран
        tg.expand();
        
        // Обработчик кнопки
        document.getElementById('sendBtn').addEventListener('click', () => {
            console.log("Кнопка нажата");
            
            // Отправляем тестовые данные
            tg.sendData("55.751244;37.618423");
            console.log("Данные отправлены");
            
            // Закрываем веб-приложение
            tg.close();
        });
        
        // Показать основную кнопку для отладки
        tg.MainButton.setText("Отправить координаты");
        tg.MainButton.show();
        tg.MainButton.onClick(() => {
            console.log("MainButton нажата");
            tg.sendData("55.751244;37.618423");
            tg.close();
        });
    </script>
</body>
</html>
